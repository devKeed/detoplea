name: Deploy to cPanel

on:
  push:
    branches: [ main ]   

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Clean previous builds
        run: |
          rm -rf .next
          rm -rf out

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create .htaccess in out directory
        run: |
          echo "RewriteEngine On" > out/.htaccess
          echo "RewriteBase /" >> out/.htaccess
          echo "" >> out/.htaccess
          echo "DirectoryIndex index.html" >> out/.htaccess
          echo "" >> out/.htaccess
          echo "# Don't rewrite if file exists" >> out/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} -f [OR]" >> out/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} -d" >> out/.htaccess
          echo "RewriteRule ^ - [L]" >> out/.htaccess
          echo "" >> out/.htaccess
          echo "# Serve index.html from directories" >> out/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME}/index.html -f" >> out/.htaccess
          echo "RewriteRule ^(.*)$ \$1/index.html [L]" >> out/.htaccess

      - name: Verify .htaccess was created
        run: |
          if [ -f "out/.htaccess" ]; then
            echo "✓ .htaccess created successfully"
            cat out/.htaccess
          else
            echo "✗ ERROR: .htaccess was not created!"
            exit 1
          fi

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la out/
          if [ -d "out/holiday-pack" ]; then
            echo "✓ holiday-pack folder exists"
            ls -la out/holiday-pack/
          else
            echo "✗ WARNING: holiday-pack folder not found!"
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/           
          server-dir: /public_html/
          protocol: ftp
          port: 21
          passive: true
          timeout: 60000